# conda-forge ships prebuilt dlib, so the image builds in a couple of minutes
# instead of compiling dlib from source (10+ minutes, several GB of RAM).
name: base
channels:
  - conda-forge
dependencies:
  - python=3.11
  - dlib>=19.24
  - face_recognition=1.3.0
  - face_recognition_models=0.3.0
  - numpy>=1.26,<2
  - pillow>=10.4
  - fastapi>=0.115
  - uvicorn>=0.32
  - python-multipart>=0.0.20
